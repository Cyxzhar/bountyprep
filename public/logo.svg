<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <style>
    .green-stroke { stroke: #9FEF00; }
    .green-fill { fill: #9FEF00; }
    .cyan-stroke { stroke: #00F0FF; }
    .cyan-fill { fill: #00F0FF; }
    
    @media (prefers-color-scheme: light) {
      .green-stroke { stroke: #7FB300; }
      .green-fill { fill: #7FB300; }
      .cyan-stroke { stroke: #0099A8; }
      .cyan-fill { fill: #0099A8; }
      .glow-filter { filter: none; }
    }
  </style>
  <defs>
    <!-- Neon green glow -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%" class="glow-filter">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feFlood flood-color="#9FEF00" flood-opacity="0.5" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Neon cyan glow -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%" class="glow-filter">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feFlood flood-color="#00F0FF" flood-opacity="0.5" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Scope Ring -->
  <circle cx="256" cy="256" r="240" stroke-width="6" stroke-opacity="0.25" filter="url(#glowGreen)" class="green-stroke" />
  
  <!-- Main Scope Ring -->
  <circle cx="256" cy="256" r="200" stroke-width="10" filter="url(#glowGreen)" class="green-stroke" />
  
  <!-- Inner Dashed Ring -->
  <circle cx="256" cy="256" r="155" stroke-width="3" stroke-dasharray="35 18" filter="url(#glowCyan)" class="cyan-stroke" />

  <!-- Crosshairs -->
  <g filter="url(#glowGreen)" class="green-stroke">
    <line x1="256" y1="16" x2="256" y2="100" stroke-width="10" stroke-linecap="round" />
    <line x1="256" y1="412" x2="256" y2="496" stroke-width="10" stroke-linecap="round" />
    <line x1="16" y1="256" x2="100" y2="256" stroke-width="10" stroke-linecap="round" />
    <line x1="412" y1="256" x2="496" y2="256" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Perfectly Centered Bug (translate-y adjusted to 241 for absolute balance) -->
  <g transform="translate(256, 241)" filter="url(#glowGreen)">
    <!-- Antennae -->
    <path d="M-20,-55 L-40,-85" stroke-width="6" stroke-linecap="round" filter="url(#glowCyan)" class="cyan-stroke" />
    <path d="M20,-55 L40,-85" stroke-width="6" stroke-linecap="round" filter="url(#glowCyan)" class="cyan-stroke" />
    
    <!-- Head -->
    <path d="M-45,-25 C-45,-60 45,-60 45,-25 L-45,-25 Z" stroke-width="8" fill="none" class="green-stroke" />
    
    <!-- Body / Shield -->
    <path d="M-55,-15 L-5, -15 L-5, 80 C-5, 110 -55, 100 -55, 60 Z" stroke-width="8" fill="none" class="green-stroke" />
    <path d="M55,-15 L5, -15 L5, 80 C5, 110 55, 100 55, 60 Z" stroke-width="8" fill="none" class="green-stroke" />
    
    <!-- Spine Circuit -->
    <line x1="0" y1="-25" x2="0" y2="105" stroke-width="3" stroke-linecap="round" opacity="0.6" class="green-stroke" />

    <!-- Circuit markings inside body -->
    <g filter="url(#glowCyan)" class="cyan-stroke cyan-fill">
        <path d="M-40,10 L-15,10 L-15,35" stroke-width="5" fill="none" />
        <circle cx="-40" cy="10" r="4" stroke="none" />
        <path d="M-40,55 L-15,55 L-15,75" stroke-width="5" fill="none" />
        <circle cx="-40" cy="55" r="4" stroke="none" />
        
        <path d="M40,10 L15,10 L15,35" stroke-width="5" fill="none" />
        <circle cx="40" cy="10" r="4" stroke="none" />
        <path d="M40,55 L15,55 L15,75" stroke-width="5" fill="none" />
        <circle cx="40" cy="55" r="4" stroke="none" />
    </g>

    <!-- Legs -->
    <g stroke-width="6" fill="none" stroke-linecap="round" class="green-stroke green-fill">
        <!-- Top pair -->
        <path d="M-55,0 L-90,0 L-110,-30" />
        <circle cx="-110" cy="-30" r="4" stroke="none" />
        <path d="M55,0 L90,0 L110,-30" />
        <circle cx="110" cy="-30" r="4" stroke="none" />
        
        <!-- Middle pair -->
        <path d="M-55,35 L-110,35" />
        <circle cx="-110" cy="35" r="4" stroke="none" />
        <path d="M55,35 L110,35" />
        <circle cx="110" cy="35" r="4" stroke="none" />
        
        <!-- Bottom pair -->
        <path d="M-55,70 L-90,70 L-110,100" />
        <circle cx="-110" cy="100" r="4" stroke="none" />
        <path d="M55,70 L90,70 L110,100" />
        <circle cx="110" cy="100" r="4" stroke="none" />
    </g>
  </g>
</svg>

