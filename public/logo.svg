<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Neon green glow -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feFlood flood-color="#9FEF00" flood-opacity="0.5" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Neon cyan glow -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feFlood flood-color="#00F0FF" flood-opacity="0.5" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Scope Ring (faint green) -->
  <circle cx="256" cy="256" r="240" stroke="#9FEF00" stroke-width="6" stroke-opacity="0.25" filter="url(#glowGreen)" />
  
  <!-- Main Scope Ring (solid green, glowing) -->
  <circle cx="256" cy="256" r="200" stroke="#9FEF00" stroke-width="10" filter="url(#glowGreen)" />
  
  <!-- Inner Dashed Ring (cyan) -->
  <circle cx="256" cy="256" r="155" stroke="#00F0FF" stroke-width="3" stroke-dasharray="35 18" filter="url(#glowCyan)" />

  <!-- Crosshairs (green, glowing) -->
  <g filter="url(#glowGreen)">
    <line x1="256" y1="16" x2="256" y2="90" stroke="#9FEF00" stroke-width="10" stroke-linecap="round" />
    <line x1="256" y1="422" x2="256" y2="496" stroke="#9FEF00" stroke-width="10" stroke-linecap="round" />
    <line x1="16" y1="256" x2="90" y2="256" stroke="#9FEF00" stroke-width="10" stroke-linecap="round" />
    <line x1="422" y1="256" x2="496" y2="256" stroke="#9FEF00" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Bug Body (centered at 256,256, scaled to fit inside inner ring) -->
  <g transform="translate(256, 256)" filter="url(#glowGreen)">
    <!-- Head (dome) -->
    <path d="M0,-70 C25,-70 40,-55 40,-35 L40,-20 C40,0 25,10 0,10 C-25,10 -40,0 -40,-20 L-40,-35 C-40,-55 -25,-70 0,-70 Z"
          stroke="#9FEF00" stroke-width="7" fill="none" />
    <!-- Eyes -->
    <circle cx="-14" cy="-40" r="6" fill="#00F0FF" />
    <circle cx="14" cy="-40" r="6" fill="#00F0FF" />

    <!-- Thorax/Body -->
    <path d="M-50,15 L-50,55 C-50,100 -30,125 0,130 C30,125 50,100 50,55 L50,15 Z"
          stroke="#9FEF00" stroke-width="7" fill="none" />
    
    <!-- Central line (spine circuit) -->
    <line x1="0" y1="-20" x2="0" y2="125" stroke="#9FEF00" stroke-width="5" />
    
    <!-- Horizontal circuit lines -->
    <line x1="-35" y1="35" x2="35" y2="35" stroke="#00F0FF" stroke-width="4" />
    <line x1="-30" y1="65" x2="30" y2="65" stroke="#00F0FF" stroke-width="4" />
    <line x1="-22" y1="95" x2="22" y2="95" stroke="#00F0FF" stroke-width="4" />
    
    <!-- Circuit nodes on body -->
    <circle cx="-35" cy="35" r="5" fill="#9FEF00" />
    <circle cx="35" cy="35" r="5" fill="#9FEF00" />
    <circle cx="-30" cy="65" r="5" fill="#9FEF00" />
    <circle cx="30" cy="65" r="5" fill="#9FEF00" />
    <circle cx="0" cy="95" r="6" fill="#00F0FF" />

    <!-- Legs (3 pairs, extending outward) -->
    <!-- Upper legs -->
    <line x1="-50" y1="25" x2="-85" y2="5" stroke="#9FEF00" stroke-width="6" stroke-linecap="round" />
    <line x1="-85" y1="5" x2="-100" y2="-15" stroke="#9FEF00" stroke-width="5" stroke-linecap="round" />
    <line x1="50" y1="25" x2="85" y2="5" stroke="#9FEF00" stroke-width="6" stroke-linecap="round" />
    <line x1="85" y1="5" x2="100" y2="-15" stroke="#9FEF00" stroke-width="5" stroke-linecap="round" />
    <!-- Middle legs -->
    <line x1="-50" y1="50" x2="-95" y2="50" stroke="#9FEF00" stroke-width="6" stroke-linecap="round" />
    <line x1="-95" y1="50" x2="-110" y2="40" stroke="#9FEF00" stroke-width="5" stroke-linecap="round" />
    <line x1="50" y1="50" x2="95" y2="50" stroke="#9FEF00" stroke-width="6" stroke-linecap="round" />
    <line x1="95" y1="50" x2="110" y2="40" stroke="#9FEF00" stroke-width="5" stroke-linecap="round" />
    <!-- Lower legs -->
    <line x1="-48" y1="78" x2="-80" y2="100" stroke="#9FEF00" stroke-width="6" stroke-linecap="round" />
    <line x1="-80" y1="100" x2="-95" y2="118" stroke="#9FEF00" stroke-width="5" stroke-linecap="round" />
    <line x1="48" y1="78" x2="80" y2="100" stroke="#9FEF00" stroke-width="6" stroke-linecap="round" />
    <line x1="80" y1="100" x2="95" y2="118" stroke="#9FEF00" stroke-width="5" stroke-linecap="round" />
    
    <!-- Leg joint nodes -->
    <circle cx="-85" cy="5" r="4" fill="#9FEF00" />
    <circle cx="85" cy="5" r="4" fill="#9FEF00" />
    <circle cx="-95" cy="50" r="4" fill="#9FEF00" />
    <circle cx="95" cy="50" r="4" fill="#9FEF00" />
    <circle cx="-80" cy="100" r="4" fill="#9FEF00" />
    <circle cx="80" cy="100" r="4" fill="#9FEF00" />

    <!-- Antennae -->
    <path d="M-15,-70 L-30,-100" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" />
    <circle cx="-30" cy="-100" r="5" fill="#00F0FF" />
    <path d="M15,-70 L30,-100" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" />
    <circle cx="30" cy="-100" r="5" fill="#00F0FF" />
  </g>
</svg>
