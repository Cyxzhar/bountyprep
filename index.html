<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <title>Bugora</title>

  <!-- Critical inline CSS for initial load -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0A0A0F 0%, #12121A 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: linear-gradient(135deg, #0A0A0F 0%, #12121A 100%);
      z-index: 9999;
    }

    .loader-logo {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(159, 239, 0, 0.1);
      border: 2px solid rgba(159, 239, 0, 0.3);
      border-radius: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    .loader-logo svg {
      width: 40px;
      height: 40px;
      fill: #9FEF00;
    }

    .loader-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(159, 239, 0, 0.2);
      border-top-color: #9FEF00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.05);
        opacity: 0.8;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Initial loader - removed by React when app mounts -->
    <div class="initial-loader">
      <div class="loader-logo">
        <img src="/logo.svg" alt="Bugora" style="width: 40px; height: 40px;" />
      </div>
      <div class="loader-spinner"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
